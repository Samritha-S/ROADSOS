name: roadsos
description: "ROADSoS - Road Accident Emergency Operating System (Hackathon Project)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.4.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
